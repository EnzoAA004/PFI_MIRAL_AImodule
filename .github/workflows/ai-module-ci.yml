name: AI Module CI

on:
  push:
  pull_request:

concurrency:
  group: ai-module-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ai_service tests import pfi_ai_service via pytest's own `pythonpath` config
# (pyproject.toml [tool.pytest.ini_options]), which does not propagate to
# subprocesses (test_notebook_executor.py spawns `python -m
# pfi_ai_service...` directly). Setting PYTHONPATH at the job level fixes
# those without touching product code — a workflow-config gap, not a
# regression (see CLOUD_02_CI_PIPELINE.md).
env:
  PYTHONPATH: ai_service

jobs:
  # Fast gate: import/compile check, matches the pre-CLOUD-02 workflow's
  # first real check (bumped from Python 3.11 to 3.12, the Dockerfile's
  # actual runtime — closes the drift flagged in CLOUD-00).
  compile-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai_service/requirements-ai-service.txt

      - name: Install AI service dependencies
        run: pip install -r ai_service/requirements-ai-service.txt

      - name: Compile AI service
        run: python -m compileall ai_service/pfi_ai_service

      - name: Smoke API contract
        run: python scripts/smoke_api_contract.py

  # CI_GENERAL: validates the product/runtime AI service. Excludes two
  # marker groups that are not product runtime code:
  #   - real_checkpoint: needs a real, non-versioned model checkpoint (see
  #     CI_MODEL_ARTIFACT below).
  #   - notebook_tooling: exercises pfi_ai_service.training.notebook_executor
  #     (a training-support script), needs nbclient/nbformat/ipykernel/
  #     jupyter_client, none of which are in requirements-ai-service.txt on
  #     purpose (keeps the runtime image lean). Verified on a clean
  #     python:3.12-slim Linux container installing only
  #     requirements-ai-service.txt + pytest: these 3 tests skip via their
  #     own existing `skipif(not HAS_NB_DEPS)` guard — no product code was
  #     changed to produce this result. See CLOUD_02_CI_PIPELINE.md for the
  #     full exclusion table and the container run that proved it.
  # pytest itself is not in requirements-ai-service.txt (a runtime
  # dependency file, correctly), so it's installed separately here.
  test:
    needs: compile-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai_service/requirements-ai-service.txt

      - name: Install AI service dependencies
        run: pip install -r ai_service/requirements-ai-service.txt pytest

      - name: Run tests (CI_GENERAL)
        run: python -m pytest ai_service/tests -m "not real_checkpoint and not notebook_tooling" -rs

  # CI_MODEL_ARTIFACT: tests explicitly marked real_checkpoint (currently:
  # the subarticular runtime smoke test, and EXT-03's Grad-CAM sanity test
  # once that branch merges). None of these have their checkpoint available
  # in this repo's CI — every one already self-skips with an explicit
  # pytest.skip()/skipif reason rather than failing. Expected result: 0
  # passed / N skipped, until a legally distributable checkpoint artifact is
  # wired in (see CHECKPOINT_DEPENDENT_TESTS in CLOUD_02_CI_PIPELINE.md).
  # No continue-on-error here on purpose: if a test in this marker group
  # ever fails for a real reason instead of skipping, this job must go red,
  # not be silently masked.
  model-artifact-tests:
    needs: compile-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai_service/requirements-ai-service.txt

      - name: Install AI service dependencies
        run: pip install -r ai_service/requirements-ai-service.txt pytest

      - name: Run tests (CI_MODEL_ARTIFACT, expected to skip)
        run: python -m pytest ai_service/tests -m real_checkpoint -rs

  # CI_NOTEBOOK_TOOLING: deliberately not implemented as a live job in
  # CLOUD-02. Installing nbclient/nbformat/ipykernel/jupyter_client is free
  # (no paid service), but this exercises a training-support script, not the
  # product runtime — out of CLOUD-02's scope of "validate the AI service."
  # Left as documented future work (see CLOUD_02_CI_PIPELINE.md) rather than
  # added here without a clear owner/need for it yet.

  docker-build:
    needs: compile-and-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (validation only, never pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pfi-ai-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
